<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cogestione Studentesca</title>
<style>
body { font-family: Arial,sans-serif; background:#f4f4f4; padding:20px; }
.card { background:#fff; padding:15px; margin-bottom:12px; border-radius:8px; }
button { padding:8px 12px; border:none; border-radius:6px; background:#007bff; color:#fff; cursor:pointer; }
button:disabled { background:#aaa; }
input, select { width:100%; padding:8px; margin:6px 0; }
.orario-menu { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.orario-btn { padding:6px 10px; border:1px solid #007bff; border-radius:6px; cursor:pointer; }
.orario-btn.disabled { opacity:0.4; pointer-events:none; }
.floating-admin { position:fixed; bottom:20px; right:20px; }
.course-disabled { opacity:0.4; pointer-events:none; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<h1>Cogestione Studentesca</h1>
<div id="app"></div>
<button class="floating-admin" onclick="checkAdmin()">Admin</button>

<script>
/* CONFIG FIREBASE */
const ADMIN_PASSWORD = "avogadro@2025";
const firebaseConfig = {
  apiKey: "AIzaSyBGJZWfFzL9hIo84ukHrSNm1P_DxZLv-xM",
  authDomain: "cogestione-liceo-avogadro.firebaseapp.com",
  databaseURL: "https://cogestione-liceo-avogadro-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cogestione-liceo-avogadro",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* STATE */
let studenti={}, corsi={}, registrazioni={}, giornoStudente="Giorno 1", utente=null, view="login", filtroOrario=null;
let bloccoIscrizioni=false; // blocco globale iscrizioni
let adminFrom="login"; // per tornare al menu corretto

/* REALTIME DATABASE LISTENER */
db.ref().on("value", snap=>{
  const d = snap.val() || {};
  studenti = d.studenti || {};
  corsi = d.corsi || {};
  registrazioni = d.registrazioni || {};
  giornoStudente = d.giornoStudente || "Giorno 1";
  render();
});

/* RENDER PRINCIPALE */
function render(){
  if(view==="login") renderLogin();
  else if(view==="home") renderHome();
  else if(view==="admin") renderAdmin();
}

/* LOGIN STUDENTE */
function renderLogin(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Login Studente</h2>
      <input id="nome" placeholder="Nome">
      <input id="cognome" placeholder="Cognome">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Entra</button>
    </div>`;
}
function login(){
  const n=document.getElementById("nome").value.trim().toLowerCase();
  const c=document.getElementById("cognome").value.trim().toLowerCase();
  const p=document.getElementById("password").value.trim();
  const found=Object.entries(studenti).find(([id,s])=>s.nome.toLowerCase()===n && s.cognome.toLowerCase()===c);
  if(!found || found[1].password!==p) return alert("Credenziali errate");
  utente = {...found[1], id: found[0]};
  view="home"; render();
}

/* HOME STUDENTE */
function renderHome(){
  if(!utente) return;
  let html=`<h3>Ciao ${utente.nome} ${utente.cognome}</h3>
  <button onclick="logout()">Logout</button><br><br>`;

  const lista=Object.entries(corsi)
    .filter(([id,c])=>c.giorno===giornoStudente)
    .sort((a,b)=>timeToMinutes(a[1].inizio)-timeToMinutes(b[1].inizio));

  const orari = [...new Set(lista.map(([id,c]) => c.inizio))]
    .sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));

  html += `<div class="orario-menu">
    <div class="orario-btn ${!filtroOrario?'disabled':''}" onclick="filtroOrario=null;renderHome()">Tutti</div>`;
  orari.forEach(o=>{
    html+=`<div class="orario-btn ${filtroOrario===o?'disabled':''}" onclick="filtroOrario='${o}';renderHome()">${o}</div>`;
  });
  html+=`</div><br>`;

  lista.forEach(([id,c])=>{
    if(filtroOrario && c.inizio!==filtroOrario) return;
    const key=utente.nome+" "+utente.cognome;
    const iscr=registrazioni[id]||[];
    const iscritto=iscr.includes(key);
    const pieno=c.max && iscr.length>=c.max;

    let disabled=false;
    if(bloccoIscrizioni && !iscritto) disabled=true;

    Object.entries(registrazioni).forEach(([cid,arr])=>{
      if(arr.includes(key)){
        const cc=corsi[cid];
        if(cc.giorno===c.giorno && !(c.fine<=cc.inizio || cc.fine<=c.inizio) && id!==cid) disabled=true;
      }
    });

    html+=`
    <div class="card ${pieno&&!iscritto||disabled?'course-disabled':''}">
      <h3>${c.nome}</h3>
      <p>${c.giorno} ${c.inizio}-${c.fine} | Aula: ${c.aula||'N/A'} | Docente: ${c.docente||'N/A'}</p>
      <p>${c.descrizione||''}</p>
      ${iscritto ? `<button onclick="annulla('${id}')" ${bloccoIscrizioni?'disabled':''}>Annulla iscrizione</button>`:
      `<button onclick="iscrivi('${id}')" ${pieno||disabled?'disabled':''}>Iscriviti</button>`}
    </div>`;
  });

  html+=`<button style="background:#dc3545;color:white;margin-top:15px;" onclick="toggleBloccoIscrizioni()">
    ${bloccoIscrizioni?'Sblocca iscrizioni':'Blocca iscrizioni'}
  </button>`;

  document.getElementById("app").innerHTML = html;
}

function logout(){ utente=null; view="login"; render(); }

function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

/* ISCRIZIONI */
function iscrivi(id){
  if(bloccoIscrizioni) return alert("Iscrizioni bloccate");
  const key = utente.nome + " " + utente.cognome;
  const corso = corsi[id];
  if(!corso) return alert("Corso non trovato");

  for(const cid in registrazioni){
    if(registrazioni[cid].includes(key)){
      const c2 = corsi[cid];
      if(!c2 || c2.giorno!==corso.giorno) continue;
      if(!(corso.fine<=c2.inizio || c2.fine<=corso.inizio)) return alert("Non puoi iscriverti a più corsi nello stesso orario");
    }
  }

  if(!registrazioni[id]) registrazioni[id]=[];
  if(registrazioni[id].includes(key)) return alert("Sei già iscritto");
  if(corso.max && registrazioni[id].length>=corso.max) return alert("Posti esauriti");

  registrazioni[id].push(key);
  db.ref("registrazioni/"+id).set(registrazioni[id]).then(()=>renderHome());
}

function annulla(id){
  if(bloccoIscrizioni) return alert("Iscrizioni bloccate");
  const key=utente.nome+" "+utente.cognome;
  const arr=(registrazioni[id]||[]).filter(x=>x!==key);
  db.ref("registrazioni/"+id).set(arr).then(()=>renderHome());
}

/* ADMIN */
function checkAdmin(){
  const code = prompt("Password admin");
  if(code===ADMIN_PASSWORD){
    adminFrom=view;
    view="admin";
    render();
  } else alert("Password errata");
}

function renderAdmin(){
  let html=`<h2>Area Admin</h2>
    <button onclick="tornaAlMenu()">Torna al menu</button>
    <div class="card">
      <h3>Giorno visibile agli studenti</h3>
      <select id="giornoSelect"><option>Giorno 1</option><option>Giorno 2</option><option>Giorno 3</option></select>
      <button onclick="setGiornoStudente()">Imposta</button>
    </div>

    <div class="card">
      <h3>Aggiungi Studente</h3>
      <input id="sn" placeholder="Nome"><input id="sc" placeholder="Cognome">
      <input id="sl" placeholder="Classe"><input id="sp" placeholder="Password">
      <button onclick="addStudente()">Aggiungi</button>
      <input type="file" id="file" accept=".csv,.txt"><button onclick="uploadStudent()">Carica file</button>
      <ul id="studentList"></ul>
    </div>

    <div class="card">
      <h3>Aggiungi Corso</h3>
      <input id="cn" placeholder="Nome"><input id="ci" placeholder="Inizio">
      <input id="cf" placeholder="Fine"><input id="ca" placeholder="Aula">
      <input id="cd" placeholder="Docente"><input id="cdesc" placeholder="Descrizione">
      <input id="cmax" placeholder="Max partecipanti">
      <select id="cg"><option>Giorno 1</option><option>Giorno 2</option><option>Giorno 3</option></select>
      <button onclick="addCorso()">Aggiungi</button>
      <ul id="courseList"></ul>
    </div>

    <div class="card">
      <h3>Ricerca Studente</h3>
      <input id="rs" placeholder="Nome o cognome"><button onclick="cercaStudente()">Cerca</button>
      <div id="res"></div>
    </div>`;

  document.getElementById("app").innerHTML = html;
  document.getElementById("giornoSelect").value=giornoStudente;
  renderStudentList();
  renderCourseList();
}

/* FUNZIONI ADMIN */
function tornaAlMenu(){ view=adminFrom; render(); }

function setGiornoStudente(){ db.ref("giornoStudente").set(document.getElementById("giornoSelect").value); }

function addStudente(){
  const n=document.getElementById("sn").value.trim();
  const c=document.getElementById("sc").value.trim();
  const l=document.getElementById("sl").value.trim();
  const p=document.getElementById("sp").value.trim();
  if(!n||!c||!l||!p) return alert("Completa tutti i campi");
  const id=Date.now(); db.ref("studenti/"+id).set({nome:n,cognome:c,classe:l,password:p});
  document.getElementById("sn").value=document.getElementById("sc").value=document.getElementById("sl").value=document.getElementById("sp").value="";
  renderStudentList();
}

function uploadStudent(){
  const f=document.getElementById("file");
  if(!f.files[0]) return alert("Seleziona file");
  const r=new FileReader();
  r.onload=e=>{ e.target.result.split("\n").forEach(l=>{
    const [n,c,lcl,p]=l.split(",");
    if(n&&c&&lcl&&p) db.ref("studenti/"+Date.now()+Math.random()).set({nome:n.trim(),cognome:c.trim(),classe:lcl.trim(),password:p.trim()});
  }); renderStudentList(); };
  r.readAsText(f.files[0]);
}

function renderStudentList(){
  const ul=document.getElementById("studentList"); ul.innerHTML="";
  Object.entries(studenti).forEach(([id,s])=>{
    const li=document.createElement("li");
    li.innerHTML=`${s.nome} ${s.cognome} (${s.classe}) 
      <button onclick="modStudent('${id}')">Modifica</button>
      <button style="background:#dc3545;color:white;" onclick="deleteStudent('${id}')">Elimina</button>`;
    ul.appendChild(li);
  });
}

function modStudent(id){
  const s=studenti[id];
  const n=prompt("Nome",s.nome); 
  const c=prompt("Cognome",s.cognome);
  const l=prompt("Classe",s.classe); 
  const p=prompt("Password",s.password);
  db.ref("studenti/"+id).set({nome:n||s.nome,cognome:c||s.cognome,classe:l||s.classe,password:p||s.password});
  renderStudentList();
}

function deleteStudent(id){
  if(!confirm("Eliminare definitivamente lo studente?")) return;
  const key = studenti[id].nome+" "+studenti[id].cognome;
  db.ref("studenti/"+id).remove();
  Object.keys(registrazioni).forEach(cid=>{
    const arr=(registrazioni[cid]||[]).filter(x=>x!==key);
    db.ref("registrazioni/"+cid).set(arr);
  });
  renderStudentList();
}

function addCorso(){
  const cn=document.getElementById("cn").value.trim(); const ci=document.getElementById("ci").value.trim();
  const cf=document.getElementById("cf").value.trim(); const ca=document.getElementById("ca").value.trim();
  const cd=document.getElementById("cd").value.trim(); const cdesc=document.getElementById("cdesc").value.trim();
  const cmax=parseInt(document.getElementById("cmax").value); const cg=document.getElementById("cg").value;
  if(!cn||!ci||!cf||!cmax) return alert("Compila nome, orari e max");
  const id=Date.now(); db.ref("corsi/"+id).set({id,nome:cn,inizio:ci,fine:cf,aula:ca,docente:cd,descrizione:cdesc,max:cmax,giorno:cg});
  document.getElementById("cn").value=document.getElementById("ci").value=document.getElementById("cf").value=document.getElementById("ca").value=document.getElementById("cd").value=document.getElementById("cdesc").value=document.getElementById("cmax").value="";
  renderCourseList();
}

function renderCourseList(){
  const ul=document.getElementById("courseList"); ul.innerHTML="";
  Object.entries(corsi).forEach(([id,c])=>{
    const iscritti=registrazioni[id]||[];
    const li=document.createElement("li");
    li.innerHTML=`<b>${c.nome}</b> (${c.giorno} ${c.inizio}-${c.fine})<br>
      Aula: ${c.aula||"N/A"} | Docente: ${c.docente||"N/A"} | Max: ${c.max||"∞"}<br>
      Iscritti: ${iscritti.length?iscritti.join(", "):"Nessuno"}<br>
      <button onclick="modCourse('${id}')">Modifica</button>
      <button style="background:#dc3545;color:white;" onclick="deleteCourse('${id}')">Elimina</button>`;
    ul.appendChild(li);
  });
}

function modCourse(id){
  const c=corsi[id];
  const n=prompt("Nome",c.nome); const ci=prompt("Inizio",c.inizio);
  const cf=prompt("Fine",c.fine); const ca=prompt("Aula",c.aula);
  const cd=prompt("Docente",c.docente); const desc=prompt("Descrizione",c.descrizione);
  const max=parseInt(prompt("Max partecipanti",c.max)); const g=prompt("Giorno",c.giorno);
  db.ref("corsi/"+id).set({id,nome:n||c.nome,inizio:ci||c.inizio,fine:cf||c.fine,aula:ca||c.aula,docente:cd||c.docente,descrizione:desc||c.descrizione,max:max||c.max,giorno:g||c.giorno});
  renderCourseList();
}

function deleteCourse(id){
  if(!confirm("Eliminare definitivamente il corso?")) return;
  db.ref("corsi/"+id).remove();
  db.ref("registrazioni/"+id).remove();
  renderCourseList();
}

/* RICERCA */
function cercaStudente(){
  const val=document.getElementById("rs").value.toLowerCase(); let out="";
  Object.entries(registrazioni).forEach(([id,arr])=>{
    arr.forEach(n=>{
      if(n.toLowerCase().includes(val)){
        const c=corsi[id]; if(c) out+=`<p>${n} → ${c.nome} (${c.giorno} ${c.inizio}-${c.fine})</p>`;
      }
    });
  }); document.getElementById("res").innerHTML=out||"Nessun risultato";
}

/* BLOCCO/RIATTIVA ISCRIZIONI */
function toggleBloccoIscrizioni(){
  bloccoIscrizioni=!bloccoIscrizioni;
  renderHome();
  alert(bloccoIscrizioni?"Iscrizioni bloccate":"Iscr
