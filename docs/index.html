<!DOCTYPE html>
<link rel="stylesheet" href="assets/css/style.css">
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cogestione Studentesca</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:20px }
h1,h2 { text-align:center }
.card { background:#fff; padding:15px; border-radius:8px; margin-bottom:12px }
button { padding:8px 12px; border:none; border-radius:6px; background:#007bff; color:#fff; cursor:pointer }
button:disabled { background:#999 }
input,select { width:100%; padding:8px; margin:6px 0 }
.orari { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px }
.orario-btn { padding:6px 10px; border:1px solid #007bff; border-radius:6px; cursor:pointer; background:#fff }
.orario-btn.active { background:#007bff; color:#fff }
.disabled { opacity:.5; pointer-events:none }
.floating-admin { position:fixed; bottom:20px; right:20px }
</style>
</head>

<body>

<h1>Cogestione Studentesca</h1>
<div id="app"></div>
<button class="floating-admin" onclick="checkAdmin()">Admin</button>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBGJZWfFzL9hIo84ukHrSNm1P_DxZLv-xM",
  authDomain: "cogestione-liceo-avogadro.firebaseapp.com",
  databaseURL: "https://cogestione-liceo-avogadro-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cogestione-liceo-avogadro",
  storageBucket: "cogestione-liceo-avogadro.firebasestorage.app",
  messagingSenderId: "901326211292",
  appId: "1:901326211292:web:df9a4d5b3317164a274c19"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔹 STATO
let studenti = {};
let corsi = {};
let iscrizioni = {};
let utente = null;
let filtroOrario = null;
const ADMIN_PASSWORD = "avogadro@2025";

// 🔹 LISTENERS REALTIME
firebase.database().ref("studenti").on("value", s => { studenti = s.val() || {}; render(); });
firebase.database().ref("corsi").on("value", s => { corsi = s.val() || {}; render(); });
firebase.database().ref("iscrizioni").on("value", s => { iscrizioni = s.val() || {}; render(); });

// 🔹 LOGIN
function renderLogin(){
  app.innerHTML = `
  <div class="card">
    <h2>Login Studente</h2>
    <input id="nome" placeholder="Nome">
    <input id="cognome" placeholder="Cognome">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Entra</button>
  </div>`;
}

function login(){
  const nome = nome.value.trim();
  const cognome = cognome.value.trim();
  const password = password.value.trim();
  const key = Object.keys(studenti).find(k =>
    studenti[k].nome.toLowerCase()==nome.toLowerCase() &&
    studenti[k].cognome.toLowerCase()==cognome.toLowerCase() &&
    studenti[k].password===password
  );
  if(!key) return alert("Studente non trovato");
  utente = { id:key, ...studenti[key] };
  render();
}

// 🔹 HOME STUDENTE
function renderHome(){
  let html = `<h2>${utente.nome} ${utente.cognome} (${utente.classe})</h2>
  <button onclick="utente=null;render()">Logout</button><br><br>`;

  const lista = Object.values(corsi).sort((a,b)=>a.inizio.localeCompare(b.inizio));
  const orari = [...new Set(lista.map(c=>c.inizio))];

  html += `<div class="orari">
    <div class="orario-btn ${!filtroOrario?'active':''}" onclick="filtroOrario=null;render()">Tutti</div>`;
  orari.forEach(o=>{
    html+=`<div class="orario-btn ${filtroOrario===o?'active':''}" onclick="filtroOrario='${o}';render()">${o}</div>`;
  });
  html += `</div>`;

  lista.forEach(c=>{
    if(filtroOrario && c.inizio!==filtroOrario) return;
    const iscr = iscrizioni[c.id] || [];
    const iscritto = iscr.includes(utente.id);
    const pieno = iscr.length>=c.max;

    html += `<div class="card">
      <h3>${c.nome}</h3>
      <p>${c.inizio}-${c.fine} | ${c.aula||''} | ${c.docente||''}</p>
      ${iscritto
        ? `<button onclick="annulla('${c.id}')">Annulla</button>`
        : `<button ${pieno?'disabled':''} onclick="iscrivi('${c.id}')">Iscriviti</button>`}
    </div>`;
  });

  app.innerHTML = html;
}

// 🔹 ISCRIZIONI
function iscrivi(id){
  firebase.database().ref(`iscrizioni/${id}/${utente.id}`).set(true);
}
function annulla(id){
  firebase.database().ref(`iscrizioni/${id}/${utente.id}`).remove();
}

// 🔹 ADMIN
function checkAdmin(){
  const p = prompt("Password admin");
  if(p===ADMIN_PASSWORD) renderAdmin();
  else alert("Password errata");
}

function renderAdmin(){
  let html = `<h2>Area Admin</h2>
  <button onclick="render()">Torna</button>

  <div class="card">
    <h3>Aggiungi Studente</h3>
    <input id="sn" placeholder="Nome">
    <input id="sc" placeholder="Cognome">
    <input id="sl" placeholder="Classe">
    <input id="sp" placeholder="Password">
    <button onclick="addStudente()">Aggiungi</button>
  </div>

  <div class="card">
    <h3>Aggiungi Corso</h3>
    <input id="cn" placeholder="Nome">
    <input id="ci" placeholder="Inizio (08:00)">
    <input id="cf" placeholder="Fine (09:00)">
    <input id="cm" placeholder="Max">
    <input id="ca" placeholder="Aula">
    <input id="cd" placeholder="Docente">
    <button onclick="addCorso()">Aggiungi</button>
  </div>`;

  app.innerHTML = html;
}

function addStudente(){
  const ref = firebase.database().ref("studenti").push();
  ref.set({ nome:sn.value, cognome:sc.value, classe:sl.value, password:sp.value });
}

function addCorso(){
  const ref = firebase.database().ref("corsi").push();
  ref.set({ id:ref.key, nome:cn.value, inizio:ci.value, fine:cf.value, max:+cm.value, aula:ca.value, docente:cd.value });
}

// 🔹 RENDER
function render(){
  if(!utente) renderLogin();
  else renderHome();
}
render();
</script>

</body>
</html>
